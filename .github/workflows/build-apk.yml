name: Build My Finance APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Mizaniati-Complete-v2-FIXED.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          test -f Mizaniati-Complete-v2-FIXED.zip
          unzip -q Mizaniati-Complete-v2-FIXED.zip -d extracted
          test -d extracted/Mizaniati-Complete
          cp -R extracted/Mizaniati-Complete/. .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Finance-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
